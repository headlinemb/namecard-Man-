<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Man Wong | Headline Hair Salon</title>
  <style>
    :root {
      --bg: #F9F6F0;
      --card-bg: #FFFFFF;
      --brand-brown: #603813;
      --brand-brown-light: #7a4a1c;
      --text-muted: #8C7A6B;
      --border-color: #EFE7DE;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--brand-brown);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      border-radius: 28px;
      padding: 36px 24px 28px;
      box-shadow: 0 12px 36px rgba(96, 56, 19, 0.08);
      text-align: center;
    }
    .avatar-wrapper {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background: #FAF6F0;
      border: 1.5px solid var(--border-color);
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(96, 56, 19, 0.06);
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 4px;
      color: var(--brand-brown);
    }
    p.title {
      font-size: 14px;
      color: var(--brand-brown-light);
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
    }
    .btn-save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--brand-brown);
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
      transition: background 0.2s ease;
    }
    .btn-save:hover {
      background: var(--brand-brown-light);
    }
    .btn-save svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      text-decoration: none;
      color: var(--brand-brown);
      background-color: #FCFAF7;
      transition: all 0.2s ease;
    }
    .link-row:hover {
      background-color: #F5EFE6;
      border-color: #E2D5C5;
      transform: translateY(-1px);
    }
    .link-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .link-icon svg {
      width: 100%;
      height: 100%;
    }
    .link-text {
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      flex-grow: 1;
    }
    .arrow {
      color: #C2B3A3;
      font-size: 14px;
    }
    .footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-wrapper">
      <img src="logo.jpg" alt="Headline Hair Salon Logo" class="avatar-img">
    </div>

    <h1>Man Wong</h1>
    <p class="title">Co-founder and Senior Stylist</p>

    <a href="contact.vcf" class="btn-save" download>

      <!-- Facebook -->
      <a href="https://www.facebook.com/HEADLINEMB" class="link-row" target="_blank" rel="noopener">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>

    </div>

    <div class="footer">
      Headline Hair Salon · Sheung Wan

  </div>
</body>
</html>
